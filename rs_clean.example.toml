# rs_clean configuration (load-only)
#
# Copy this file to one of the discovery locations, or pass it with --config.
# CLI flags override file values; omitted keys keep built-in defaults.
#
# Discovery when --config is absent (first existing file wins):
#   1. ./rs_clean.toml, ./.rs_clean.toml, ./rs_clean.json, ./.rs_clean.json
#   2. {config_dir}/rs_clean/rs_clean.toml, then {config_dir}/rs_clean/rs_clean.json
#      config_dir is dirs::config_dir():
#        Linux:   ~/.config
#        Windows: %APPDATA%
#        macOS:   ~/Library/Application Support
#   3. ~/.rs_clean/rs_clean.toml
#
# There is no `rs_clean config init/set/show` command.
#
# Field names match the Config struct. Unknown keys are an error.

# Directory to scan. Used only when neither a positional PATH nor -p/--path is given.
path = "."

# Directory names skipped during the project scan (not cleaner types).
exclude_dir = ["node_modules", "target", "dist", "build", "vendor"]

# Disable cleaners by type: cargo, go, gradle, nodejs (alias: node), flutter, python, mvn.
# `mvn.cmd` is accepted as mvn. Default is empty (all available cleaners enabled).
exclude_type = []

# Max WalkDir depth (start directory is depth 0). Also used when sizing artifact dirs.
max_directory_depth = 5

# Cap on files counted while sizing each artifact directory.
max_files_per_project = 10000

verbose = false
dry_run = false
no_confirm = false
